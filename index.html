<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1035">
<title>Сходи в небо</title>

<!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Піксельний шрифт -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1b1035;        /* фон нижньої панелі */
    --card:#2c1f5c;       /* кнопка покращення */
    --edge:#5b47b0;
    --edge-dark:#241a52;
    --gold:#ffd23f;
    --paper:#fff6dc;
    --dim:#9d90cf;
    --pixel:'Press Start 2P','Courier New',monospace;
    --o2:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink);
    --o3:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px -3px var(--ink),3px -3px var(--ink),-3px 3px var(--ink);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none}
  body{font-family:var(--pixel);color:var(--paper)}

  #app{
    position:fixed;top:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:560px;
    height:100vh;height:100dvh;max-height:var(--tg-viewport-stable-height,100dvh);
    display:flex;flex-direction:column;background:var(--ink);
  }

  /* ---------- сцена ---------- */
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;cursor:pointer;background:#0a1420}
  #game{position:absolute;left:0;top:0;display:block;image-rendering:pixelated}

  #hud{
    position:absolute;left:0;right:0;top:0;
    padding:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 16px) 12px 0;
    display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;
  }
  #score-row{display:flex;align-items:center;gap:10px}
  #score-star{width:27px;height:27px;image-rendering:pixelated}
  #score{font-size:28px;line-height:1;color:var(--gold);text-shadow:var(--o3),0 5px 0 var(--ink)}
  #score-diamond{width:22px;height:22px;image-rendering:pixelated;margin-left:6px}
  #diamonds{font-size:20px;line-height:1;color:#7ee3ff;text-shadow:var(--o2),0 4px 0 var(--ink)}
  #per-click{font-size:9px;line-height:1.4;color:var(--paper);text-shadow:var(--o2)}

  /* ---------- індикатор поверхів ---------- */
  #floor-indicator{display:flex;flex-direction:column;align-items:center;gap:4px}
  #floor-label{font-size:9px;color:var(--gold);text-shadow:var(--o2)}
  #floor-name{font-size:8px;color:var(--paper);text-shadow:var(--o2);letter-spacing:.3px}
  #floor-pips{display:flex;gap:5px}
  .fpip{width:11px;height:11px;background:#2c1f5c;box-shadow:inset 0 0 0 2px #4b3a8f;transition:background .2s}
  .fpip.done{background:var(--gold);box-shadow:inset 0 0 0 2px #8a5a0a}
  .fpip.cur{background:#7be0a4;box-shadow:inset 0 0 0 2px #3fae74}

  /* ---------- кнопка перемикання виду ---------- */
  #btn-view{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 10px);
    right:10px;width:34px;height:34px;border:0;pointer-events:auto;cursor:pointer;
    background:#2c1f5c;box-shadow:inset 0 0 0 2px #5b47b0,inset 0 -4px 0 0 #241a52;
    font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;
  }
  #btn-view:active{transform:translateY(1px)}

  /* ---------- кнопка чіту ---------- */
  #btn-cheat{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 10px);
    left:10px;width:26px;height:26px;border:0;pointer-events:auto;cursor:pointer;
    background:#2c1f5c;box-shadow:inset 0 0 0 2px #5b47b0,inset 0 -3px 0 0 #241a52;
    font-size:12px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;opacity:.55;
  }
  #btn-cheat.on{background:#8a5a0a;box-shadow:inset 0 0 0 2px var(--gold),inset 0 -3px 0 0 #5c3c06;opacity:1}
  #btn-cheat:active{transform:translateY(1px)}

  /* ---------- бій ---------- */
  #mons-name{font-size:9px;color:var(--paper);text-shadow:var(--o2);text-align:center}
  #combat-hud{
    position:absolute;left:10px;right:10px;bottom:14px;display:flex;flex-direction:column;gap:6px;
    pointer-events:none;
  }
  #combat-hud.off{display:none}
  .hp-row{display:flex;align-items:center;gap:8px}
  .hp-lbl{font-size:14px;text-shadow:var(--o2)}
  .hp-bar{flex:1 1 auto;height:12px;background:#1a1030;border:2px solid #000;box-shadow:inset 0 0 0 1px #4b3a8f}
  .hp-fill{height:100%;width:100%}
  .hp-fill.mons{background:linear-gradient(#ff6b6b,#c62d2d)}
  .hp-fill.hero{background:linear-gradient(#8fe06a,#4ea83a)}
  .hp-num{font-size:8px;color:var(--paper);text-shadow:var(--o2);min-width:44px;text-align:right}

  /* ---------- вкладки ---------- */
  #tabs{flex:0 0 auto;display:flex;gap:5px;padding:10px 12px 0;background:var(--ink)}
  .tab{
    flex:1 1 0;min-width:0;padding:8px 2px;border:0;background:#2c1f5c;color:var(--dim);font-family:var(--pixel);
    font-size:8px;white-space:nowrap;box-shadow:inset 0 0 0 2px #4b3a8f;cursor:pointer;touch-action:manipulation;
  }
  .tab.active{background:#3d2a7a;color:var(--paper);box-shadow:inset 0 0 0 2px var(--gold)}

  /* ---------- панелі ---------- */
  #panel-wpn,#panel-arm,#panel-skn,#panel-qst{
    flex:0 0 auto;max-height:34vh;overflow-y:auto;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--ink);border-top:4px solid #4b3a8f;display:flex;flex-direction:column;gap:8px;
  }
  #panel-wpn.off,#panel-arm.off,#panel-skn.off,#panel-qst.off{display:none}
  .quest-bar{height:6px;background:#1a1030;border:1px solid #000;box-shadow:inset 0 0 0 1px #4b3a8f;margin-top:5px}
  .quest-bar-fill{height:100%;background:linear-gradient(#7be0a4,#4ea83a)}
  .wpn{
    display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);
    box-shadow:inset 0 0 0 3px var(--edge),inset 0 -6px 0 0 var(--edge-dark);
  }
  .wpn.owned{--edge:#4ea83a;--edge-dark:#215c1e}
  .wpn.can{--edge:var(--gold);--edge-dark:#8a5a0a}
  .wpn.eq{--edge:#7be0a4;--edge-dark:#2f7a55}
  .wpn-ic{font-size:20px;flex:none}
  .wpn-info{flex:1 1 auto;min-width:0}
  .wpn-name{font-size:10px;color:var(--paper)}
  .wpn-dmg{font-size:8px;color:var(--dim);margin-top:3px}
  .wpn-btn{
    flex:none;border:0;padding:8px 10px;background:#4b3a8f;color:var(--paper);font-family:var(--pixel);
    font-size:9px;display:flex;align-items:center;gap:5px;cursor:pointer;touch-action:manipulation;
  }
  .wpn-btn img{width:14px;height:14px;image-rendering:pixelated}
  .wpn-btn.can{background:var(--gold);color:#3a2400}
  .wpn-btn.owned{background:#215c1e;color:#bdf5b0}
  .wpn-btn:disabled{opacity:.7}

  .wpn-buff{font-size:7px;line-height:1.6;color:#7be0a4;margin-top:4px}
  .wpn-sub{font-size:7px;line-height:1.6;color:#ffd9a0;margin-top:2px}
  .skn-pv{width:27px;height:auto;flex:none;image-rendering:pixelated}
  #floor-prog{font-size:8px;color:var(--paper);text-shadow:var(--o2)}

  #floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .floater{position:absolute;font-size:14px;color:var(--gold);text-shadow:var(--o2);white-space:nowrap;will-change:transform,opacity}

  #hint{
    position:absolute;left:0;right:0;bottom:18px;text-align:center;
    font-size:11px;color:var(--gold);text-shadow:var(--o2);pointer-events:none;
    animation:blink 1.2s steps(1) infinite;
  }
  #hint.off{display:none}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}

  #panel{
    flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--ink);border-top:4px solid #4b3a8f;max-height:34vh;overflow-y:auto;
  }
  #panel.off{display:none}
  .up-sec{grid-column:1/-1;font-size:9px;color:var(--gold);text-shadow:var(--o2);padding-top:4px}
  .up{
    --edge:#5b47b0;--edge-dark:#241a52;
    position:relative;display:flex;flex-direction:column;gap:8px;
    padding:12px 12px 16px;border:0;margin:0;background:var(--card);
    font-family:var(--pixel);color:var(--dim);text-align:left;cursor:pointer;touch-action:manipulation;
    box-shadow:inset 0 0 0 3px var(--edge),inset 0 -8px 0 0 var(--edge-dark);
    clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  }
  .up.can{--edge:var(--gold);--edge-dark:#8a5a0a;background:#3d2a7a}
  .up:active{transform:translateY(2px)}
  .up-head{display:flex;align-items:center;gap:8px}
  .up-head img{width:27px;height:27px;flex:none;image-rendering:pixelated}
  .up-name{font-size:10px;line-height:1.35;color:var(--paper)}
  .up-eff{font-size:8px;line-height:1.5;color:var(--dim)}
  .up-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:2px}
  .cost{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
  .cost img{width:18px;height:18px;image-rendering:pixelated;filter:grayscale(1) opacity(.55)}
  .up.can .cost{color:var(--gold)}
  .up.can .cost img{filter:none}
  .lvl{font-size:8px;color:var(--dim);white-space:nowrap}
</style>
</head>

<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <button id="btn-view" type="button" title="Небо / Стіни вежі">🏯</button>
    <button id="btn-cheat" type="button" title="Чіт: +5000 за клік">🐞</button>

    <div id="hud">
      <div id="score-row">
        <img id="score-star" data-icon="star" alt=""><span id="score">0</span>
        <img id="score-diamond" data-icon="diamond" alt=""><span id="diamonds">0</span>
      </div>
      <div id="per-click">+1 за клік</div>
      <div id="floor-indicator">
        <span id="floor-label">Поверх 1/9</span>
        <span id="floor-name">Драговина слизнів</span>
        <span id="floor-prog"></span>
        <div id="floor-pips"></div>
      </div>
    </div>

    <div id="combat-hud" class="off">
      <div id="mons-name"></div>
      <div class="hp-row"><span class="hp-lbl">👹</span><div class="hp-bar"><div class="hp-fill mons" id="mhp-fill"></div></div><span class="hp-num" id="mhp-num"></span></div>
      <div class="hp-row"><span class="hp-lbl">❤</span><div class="hp-bar"><div class="hp-fill hero" id="php-fill"></div></div><span class="hp-num" id="php-num"></span></div>
    </div>

    <div id="floaters"></div>
    <div id="hint">Тапай по екрану!</div>
  </div>

  <div id="tabs">
    <button class="tab active" id="tab-upg" type="button">Прокачка</button>
    <button class="tab" id="tab-wpn" type="button">⚔ Зброя</button>
    <button class="tab" id="tab-arm" type="button">🛡 Броня</button>
    <button class="tab" id="tab-skn" type="button">🎭 Образи</button>
    <button class="tab" id="tab-qst" type="button">📜 Завдання</button>
  </div>

  <div id="panel">
    <button class="up" id="up-power" type="button">
      <div class="up-head"><img data-icon="arrow" alt=""><span class="up-name">Сила кліку</span></div>
      <div class="up-eff" id="eff-power"></div>
      <div class="up-foot">
        <span class="cost"><img data-icon="star" alt=""><b id="cost-power">10</b></span>
        <span class="lvl" id="lvl-power"></span>
      </div>
    </button>

    <button class="up" id="up-auto" type="button">
      <div class="up-head"><img data-icon="bolt" alt=""><span class="up-name">Автоклік</span></div>
      <div class="up-eff" id="eff-auto"></div>
      <div class="up-foot">
        <span class="cost"><img data-icon="star" alt=""><b id="cost-auto">50</b></span>
        <span class="lvl" id="lvl-auto"></span>
      </div>
    </button>
    <div id="more-ups" style="display:contents"></div>
  </div>

  <div id="panel-wpn" class="off"></div>
  <div id="panel-arm" class="off"></div>
  <div id="panel-skn" class="off"></div>
  <div id="panel-qst" class="off"></div>
</div>

<script>
(() => {
'use strict';

/* --- Завантаження картинки для скіна Емілії --- */
const EMILIA_IMG = new Image();
EMILIA_IMG.src = '32746.png';

const CFG = {
  POWER_BASE_COST: 10,
  POWER_GROWTH:    1.5,
  AUTO_BASE_COST:  50,
  AUTO_GROWTH:     1.6,
  DAY_LENGTH:      240,
  STAIR_DEPTH:     3,
  SAVE_KEY:        'stairs-to-sky-v1',
  HP_MAX:          100,
  HP_PER_LEVEL:    20,
  HP_BASE_COST:    40,
  HP_GROWTH:       1.55,
  ENC_TIME_SEC:    120,
  ENC_STEPS_AHEAD: 2,
  ENC_ATK_EVERY:   1.1,
  DEATH_LOSS:      0.2,
  HERO_SCALE:      0.7,
  MON_SCALE:       0.6
};

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.setHeaderColor('#1b1035'); tg.setBackgroundColor('#1b1035'); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
const haptic = k => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };

const $   = id => document.getElementById(id);
const mk  = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const mod = (a, n) => ((a % n) + n) % n;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e7) return (n / 1e6).toFixed(2) + 'M';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

/* --- Стан гри --- */
let state = {
  score: 0,
  diamonds: 0,
  powerLvl: 0,
  autoLvl: 0,
  hpLvl: 0,
  steps: 0,
  floorTier: 0,
  weapons: ['fists'],
  weapon: 'fists',
  armor: ['cloth'],
  skins: ['default'],
  skin: 'default',
  ups: {},
  quests: [],
  monstersKilled: 0,
  kills: { slime:0, goblin:0, skeleton:0, bat:0, spider:0, lava:0, ghost:0, demon:0, boss:0 }
};

const UPGRADES = [
  { id:'mastery', name:'Майстерність зброї', ic:'⚔️', cur:'star', base:2500,  g:1.32, max:40, show:l => `Урон +${l * 3}%` },
  { id:'crit',    name:'Критичний удар',     ic:'💥', cur:'star', base:6000,  g:1.28, max:40, show:l => `Шанс крита ${l}%` },
  { id:'critdmg', name:'Сила крита',         ic:'🔥', cur:'star', base:9000,  g:1.30, max:40, show:l => `Крит ×${(1.5 + l * 0.05).toFixed(2)}` },
  { id:'loot',    name:'Жадібність',         ic:'💰', cur:'star', base:4000,  g:1.30, max:40, show:l => `Здобич +${l * 4}%` },
  { id:'dstars',  name:'Діамантова сила',    ic:'💎', cur:'diamond', base:39, g:1.25, max:15, show:l => `Зірки +${l * 5}%` }
];

const SKINS = [
  { id:'default', name:'Стандартний', cost:0, cur:'star', buff:{}, img:null },
  { id:'rz_emilia', name:'Емілія', cost:320, cur:'diamond', buff:{ hp:0.15, guard:0.08 }, img: EMILIA_IMG }
];

const skinById = id => SKINS.find(s => s.id === id) || SKINS[0];
const upLvl = id => (state.ups[id] || 0);

/* --- Canvas і графічна логіка --- */
const canvas = $('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
  const stage = $('stage');
  W = stage.clientWidth;
  H = stage.clientHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

let time = 0;
let cheatMode = false;

/* --- Малювання героя --- */
function drawHero(x, y) {
  const currentSkin = skinById(state.skin);

  ctx.save();
  ctx.translate(x, y);

  if (currentSkin.img && currentSkin.img.complete && currentSkin.img.naturalWidth !== 0) {
    // Малюємо зображення PNG (наприклад, Емілія зі скіна 32746.png)
    const w = currentSkin.img.width * CFG.HERO_SCALE;
    const h = currentSkin.img.height * CFG.HERO_SCALE;
    ctx.drawImage(currentSkin.img, -w / 2, -h, w, h);
  } else {
    // Якщо картинка ще завантажується або стандартний скін — малюємо плейсхолдер
    ctx.fillStyle = '#7be0a4';
    ctx.fillRect(-10, -25, 20, 25);
    ctx.fillStyle = '#1b1035';
    ctx.fillRect(-6, -20, 4, 4);
    ctx.fillRect(2, -20, 4, 4);
  }

  ctx.restore();
}

/* --- Головний цикл малювання --- */
function render() {
  time += 0.016;
  ctx.clearRect(0, 0, W, H);

  // Фон
  ctx.fillStyle = '#0a1420';
  ctx.fillRect(0, 0, W, H);

  // Сходинки
  ctx.fillStyle = '#4d4568';
  for (let i = 0; i < 10; i++) {
    const sx = W / 2 - 100 + i * 20;
    const sy = H - 50 - i * 20;
    ctx.fillRect(sx, sy, 80, 20);
  }

  // Персонаж
  drawHero(W / 2, H - 50);

  requestAnimationFrame(render);
}

/* --- Обробка тапів --- */
$('stage').addEventListener('pointerdown', (e) => {
  const add = cheatMode ? 5000 : (1 + state.powerLvl);
  state.score += add;
  state.steps += 1;
  haptic('light');

  // Плаваючий текст
  const fl = document.createElement('div');
  fl.className = 'floater';
  fl.textContent = '+' + fmt(add);
  fl.style.left = e.clientX + 'px';
  fl.style.top = e.clientY + 'px';
  $('floaters').appendChild(fl);
  setTimeout(() => fl.remove(), 800);

  updateUI();
});

/* --- Чіт кнопка --- */
$('btn-cheat').addEventListener('click', (e) => {
  e.stopPropagation();
  cheatMode = !cheatMode;
  $('btn-cheat').classList.toggle('on', cheatMode);
});

/* --- Оновлення HUD/UI --- */
function updateUI() {
  $('score').textContent = fmt(state.score);
  $('diamonds').textContent = fmt(state.diamonds);$('per-click').textContent = '+' + fmt(cheatMode ? 5000 : (1 + state.powerLvl)) + ' за клік';
}

/* Ініціалізація іконок у верстці */
document.querySelectorAll('[data-icon="star"]').forEach(img => img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAJCAYAAAD86P2FAAAAJUlEQVR42mNgYGD4z0AEMC4A4oA/A0gAB0yKACpG14A1wAD/AwA6/hMCz8C0xQAAAABJRU5ErkJggg==');
document.querySelectorAll('[data-icon="diamond"]').forEach(img => img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAJCAYAAAD86P2FAAAAIElEQVR42mP8z8AARAyM/xlgAqwApBiM0TWgSzA3Y2AAvRQTArr05oAAAAAARS45AAAAAElFTkSuQmCC');

updateUI();
render();

})();
</script>
</body>
</html>
