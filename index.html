<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1035">
<title>Сходи в небо</title>

<!-- Піксельний шрифт (має кирилицю) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1b1035;        /* фон нижньої панелі */
    --card:#2c1f5c;       /* кнопка покращення */
    --edge:#5b47b0;
    --edge-dark:#241a52;
    --gold:#ffd23f;
    --paper:#fff6dc;
    --dim:#9d90cf;
    --pixel:'Press Start 2P','Courier New',monospace;
    --o2:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink);
    --o3:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px -3px var(--ink),3px -3px var(--ink),-3px 3px var(--ink);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none}
  body{font-family:var(--pixel);color:var(--paper)}

  #app{
    position:fixed;top:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:560px;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;background:var(--ink);
  }

  html.in-tg #app{max-height:var(--tg-viewport-stable-height,100dvh)}
  #err{display:none;position:fixed;left:0;right:0;top:0;z-index:99;max-height:45%;overflow:auto;padding:8px 10px;
       background:#a82d34;color:#fff;font:11px/1.35 monospace;white-space:pre-wrap;-webkit-user-select:text;user-select:text}

  /* ---------- сцена ---------- */
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;cursor:pointer;background:#4aa8ff}
  #game{position:absolute;left:0;top:0;display:block;image-rendering:pixelated}

  #hud{
    position:absolute;left:0;right:0;top:0;
    padding:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 16px) 12px 0;
    display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;
  }
  #score-row{display:flex;align-items:center;gap:10px}
  #score-star{width:27px;height:27px;image-rendering:pixelated}
  #score{font-size:28px;line-height:1;color:var(--gold);text-shadow:var(--o3),0 5px 0 var(--ink)}
  #per-click{font-size:9px;line-height:1.4;color:var(--paper);text-shadow:var(--o2)}

  #floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .floater{position:absolute;font-size:14px;color:var(--gold);text-shadow:var(--o2);white-space:nowrap;will-change:transform,opacity}

  #hint{
    position:absolute;left:0;right:0;bottom:18px;text-align:center;
    font-size:11px;color:var(--gold);text-shadow:var(--o2);pointer-events:none;
    animation:blink 1.2s steps(1) infinite;
  }
  #hint.off{display:none}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}

  /* ---------- панель покращень ---------- */
  #panel{
    flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--ink);border-top:4px solid #4b3a8f;
  }
  .up{
    --edge:#5b47b0;--edge-dark:#241a52;
    position:relative;display:flex;flex-direction:column;gap:8px;
    padding:12px 12px 16px;border:0;margin:0;background:var(--card);
    font-family:var(--pixel);color:var(--dim);text-align:left;cursor:pointer;touch-action:manipulation;
    box-shadow:inset 0 0 0 3px var(--edge),inset 0 -8px 0 0 var(--edge-dark);
    clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  }
  .up.can{--edge:var(--gold);--edge-dark:#8a5a0a;background:#3d2a7a}
  .up:active{transform:translateY(2px)}
  .up:focus-visible{--edge:var(--paper)}
  .up-head{display:flex;align-items:center;gap:8px}
  .up-head img{width:27px;height:27px;flex:none;image-rendering:pixelated}
  .up-name{font-size:10px;line-height:1.35;color:var(--paper)}
  .up-eff{font-size:8px;line-height:1.5;color:var(--dim)}
  .up-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:2px}
  .cost{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
  .cost img{width:18px;height:18px;image-rendering:pixelated;filter:grayscale(1) opacity(.55)}
  .up.can .cost{color:var(--gold)}
  .up.can .cost img{filter:none}
  .lvl{font-size:8px;color:var(--dim);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){#hint{animation:none}}
</style>
</head>

<div id="err"></div>
<noscript><div style="position:fixed;left:0;right:0;top:0;z-index:99;padding:10px;background:#a82d34;color:#fff;font:12px monospace">JavaScript вимкнено в цьому браузері — гра не запуститься.</div></noscript>
<script>
window.__showErr = function (m) {
  var e = document.getElementById('err');
  if (!e || e.textContent.length > 1500) return;
  e.style.display = 'block';
  e.textContent += String(m).slice(0, 400) + '\n';
};
window.addEventListener('error', function (ev) { window.__showErr('JS: ' + ev.message + (ev.lineno ? ' (рядок ' + ev.lineno + ')' : '')); });
document.addEventListener('DOMContentLoaded', function () {
  var h = document.getElementById('hint'); if (h) h.textContent += ' · v3';
});
setTimeout(function () { if (!window.__started) window.__showErr('Гра не запустилась: скрипт не дійшов до кінця (версія v3)'); }, 2500);
window.addEventListener('unhandledrejection', function (ev) { window.__showErr('Promise: ' + (ev.reason && ev.reason.message || ev.reason)); });
</script>
<div id="app">
  <div id="stage">

<script>
(() => {
'use strict';
try { if (!document.createElement('canvas').getContext('2d')) window.__showErr('Цей браузер не дає створити canvas 2D'); } catch (e) { window.__showErr('canvas: ' + e); }

/* ==========================================================================
   1. НАЛАШТУВАННЯ ГРИ — міняй цифри тут
   ========================================================================== */
const CFG = {
  POWER_BASE_COST: 10,    // ціна першого покращення кліку
  POWER_GROWTH:    1.5,   // у скільки разів дорожчає кожне наступне (1.5 = +50%)
  AUTO_BASE_COST:  50,    // ціна першого автокліку
  AUTO_GROWTH:     1.6,   // подорожчання автокліку
  DAY_LENGTH:      240,   // за скільки сходинок небо проходить повне коло день → ніч → день
  STAIR_DEPTH:     3,     // товщина сходів у блоках (більше = більше каменю, менше неба; 99 = суцільна стіна)
  SAVE_KEY:        'stairs-to-sky-v1'
};

/* ==========================================================================
   2. СВОЇ СПРАЙТИ (необов'язково)
   Усі спрайти вже намальовані нижче в коді. Якщо хочеш свої PNG — поклади
   файли поруч з index.html і впиши шляхи. Що не вписано — лишається вбудоване.
   Герой: краще 12×17 px (обличчям вправо), сходинка: 16×16 px.
   ========================================================================== */
const CUSTOM = {
  hero: { idle: '', a: '', b: '' },   // напр. 'img/hero_idle.png', 'img/hero_step1.png', 'img/hero_step2.png'
  stairTop:  '',                      // верхня сходинка (з травою), напр. 'img/stair_top.png'
  stairBody: ''                       // «тіло» сходів під нею, напр. 'img/stair_body.png'
};

/* ==========================================================================
   3. TELEGRAM
   ========================================================================== */
let tg = null;
function initTelegram() {
  try { tg = window.Telegram && window.Telegram.WebApp; } catch (e) { tg = null; }
  if (!tg) return;
  try { if (tg.initData || (tg.platform && tg.platform !== 'unknown')) document.documentElement.classList.add('in-tg'); } catch (e) {}
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.setHeaderColor('#1b1035'); tg.setBackgroundColor('#1b1035'); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  try { tg.onEvent('viewportChanged', resize); } catch (e) {}
}
const haptic     = k => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };
const hapticNote = k => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(k); } catch (e) {} };

/* ==========================================================================
   4. ДОПОМІЖНЕ
   ========================================================================== */
const $   = id => document.getElementById(id);
const mk  = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const mod = (a, n) => ((a % n) + n) % n;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb  = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
function rng(seed) { let s = seed >>> 0; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
function hash2(a, b) {
  let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e7) return (n / 1e6).toFixed(2) + 'M';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

/* ==========================================================================
   5. СПРАЙТИ (піксель-арт, малюється з текстових масивів)
   ========================================================================== */
const PAL = {
  k:'#2a1b3d',            // контур
  r:'#e4453f', R:'#a82d34',   // кепка
  s:'#f5c9a0', w:'#ffffff',   // шкіра, білок ока
  b:'#3f8be0', B:'#2b64ad',   // футболка
  p:'#5a4a8a',                // штани
  o:'#8a5a35',                // взуття
  y:'#ffd23f', Y:'#e8a317',   // золото
  g:'#7be0a4', G:'#3fae74'    // м'ята
};
function fromRows(rows, pal = PAL) {
  const c = mk(rows[0].length, rows.length), g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch !== '.' && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }));
  return c;
}

/* --- Герой 12×17, дивиться вправо: тіло + 3 пози ніг --- */
const HERO_BODY = [
  '....kkkk....',
  '...krrrrk...',
  '..krrrrrrk..',
  '..krrrrrrrk.',
  '..kRRRRRRRRk',
  '..ksssssssk.',
  '..ksssswksk.',
  '..ksssssssk.',
  '...ksssssk..',
  '..kbbbbbbk..',
  '.kbbbbbbbbk.',
  '.ksbbBBbbsk.',
  '..kkbbbbkk..',
  '...kppppk...'
];
const HERO_LEGS = {
  idle: ['...kppkppk..', '...kppkppk..', '..koookoook.'],
  a:    ['...kppkppk..', '..kppk.kppk.', '..kook.kook.'],
  b:    ['...kppkppk..', '...kppkoook.', '..koook.....']
};
const HERO = {};
for (const k in HERO_LEGS) HERO[k] = fromRows(HERO_BODY.concat(HERO_LEGS[k]));

/* --- Іконки інтерфейсу --- */
const ICONS = {
  star: fromRows([
    '....y....',
    '...yyy...',
    '...yyy...',
    'yyyyyyyyY',
    '.yyyyyyY.',
    '..yyyyY..',
    '..yyyyY..',
    '.yyyYyyY.',
    '.yy...YY.'
  ]),
  arrow: fromRows([
    '....g....',
    '...ggg...',
    '..ggggg..',
    '.ggggggg.',
    'ggggggggg',
    '...ggG...',
    '...ggG...',
    '...ggG...',
    '...ggG...'
  ]),
  bolt: fromRows([
    '.....yy..',
    '....yyY..',
    '...yyY...',
    '..yyyyyy.',
    '.....yY..',
    '....yY...',
    '...yY....',
    '..yY.....',
    '..Y......'
  ])
};

/* --- Блоки сходів 16×16: цегла + трава зверху --- */
const STONE = { base:'#8a7fb0', light:'#a99fd0', shade:'#6d6392', mortar:'#4f4673' };
const GRASS = { hi:'#9be564', mid:'#5cbf3d', dark:'#3a8f33' };
function makeBlock(kind, variant) {   // kind: 'top' | 'body' | 'bottom'
  const c = mk(16, 16), g = c.getContext('2d');
  const r = rng(variant * 977 + (kind === 'top' ? 13 : kind === 'bottom' ? 41 : 71));
  const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  for (let y = 0; y < 16; y++) {
    const course = y >> 2, row = y & 3, off = (course & 1) ? 4 : 0;
    for (let x = 0; x < 16; x++) {
      const xx = (x + off) & 7;
      let col;
      if (row === 3 || xx === 7) col = STONE.mortar;
      else if (row === 0)        col = STONE.light;
      else if (xx === 6)         col = STONE.shade;
      else                       col = STONE.base;
      px(x, y, col);
    }
  }
  for (let i = 0; i < 6; i++) px((r() * 16) | 0, (r() * 16) | 0, r() < .5 ? STONE.shade : STONE.light);
  if (kind === 'bottom') {                       // темний низ, щоб сходи мали об'єм
    for (let x = 0; x < 16; x++) { px(x, 13, STONE.shade); px(x, 14, STONE.mortar); px(x, 15, '#3a3159'); }
  }
  if (kind === 'top') {
    for (let x = 0; x < 16; x++) {
      const d = (x * 7 + variant * 5) % 5;
      px(x, 0, GRASS.hi); px(x, 1, GRASS.mid); px(x, 2, GRASS.mid);
      if (d < 4) px(x, 3, GRASS.dark);
      if (d % 2 === 0) px(x, 4, GRASS.dark);
      if (d === 1 && variant === 2) px(x, 0, '#ffe66d');   // жовта квіточка
    }
  }
  return c;
}
function tint(src, m) {
  const c = mk(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  try {
    const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
    for (let i = 0; i < a.length; i += 4) { a[i] *= m[0]; a[i + 1] *= m[1]; a[i + 2] *= m[2]; }
    g.putImageData(d, 0, 0);
  } catch (e) { return src; }
  return c;
}
const NIGHT_TINT = [0.55, 0.6, 0.95];
const TILES = { day: { top: [], body: [], bottom: [] }, night: { top: [], body: [], bottom: [] } };
for (let v = 0; v < 3; v++) {
  TILES.day.top.push(makeBlock('top', v));
  TILES.day.body.push(makeBlock('body', v));
  TILES.day.bottom.push(makeBlock('bottom', v));
}
for (const k of ['top', 'body', 'bottom']) TILES.night[k] = TILES.day[k].map(t => tint(t, NIGHT_TINT));

/* --- Хмари, сонце, місяць --- */
function makeCloud(w, h, blobs) {
  const c = mk(w, h), g = c.getContext('2d');
  for (let y = 0; y < h - 1; y++) for (let x = 0; x < w; x++) {
    let inside = false;
    for (const [bx, by, br] of blobs) { const dx = x - bx, dy = y - by; if (dx * dx + dy * dy <= br * br) { inside = true; break; } }
    if (inside) { g.fillStyle = y >= h - 4 ? '#c9dcff' : (y <= 2 ? '#ffffff' : '#f2f7ff'); g.fillRect(x, y, 1, 1); }
  }
  return c;
}
const CLOUDS = [
  makeCloud(24, 10, [[6,7,4],[12,5,5],[18,7,4]]),
  makeCloud(34, 12, [[8,9,5],[16,6,6],[25,8,6],[30,9,3]]),
  makeCloud(46, 15, [[9,11,7],[20,7,8],[32,9,8],[40,11,5]])
];
function makeDisc(kind) {
  const c = mk(15, 15), g = c.getContext('2d');
  for (let y = 0; y < 15; y++) for (let x = 0; x < 15; x++) {
    const d = Math.hypot(x - 7, y - 7);
    if (d > 7) continue;
    if (kind === 'sun') { g.fillStyle = d > 5.4 ? '#ffb833' : '#ffe66d'; }
    else {
      if (Math.hypot(x - 10, y - 5) <= 6.2) continue;               // вирізаємо серп
      g.fillStyle = (x + y) % 5 === 0 ? '#d8d3a0' : '#f3efc6';
    }
    g.fillRect(x, y, 1, 1);
  }
  return c;
}
const SUN = makeDisc('sun'), MOON = makeDisc('moon');

/* --- Гори (паралакс) --- */
function makeMountains(w, h, peaks, c) {
  const cv = mk(w, h), g = cv.getContext('2d');
  for (let x = 0; x < w; x++) {
    let top = 3, px = 0;
    for (const [p, ph] of peaks) {
      const d = Math.min(Math.abs(x - p), w - Math.abs(x - p)), v = ph - d;
      if (v > top) { top = v; px = p; }
    }
    let dx = x - px; if (dx > w / 2) dx -= w; if (dx < -w / 2) dx += w;
    const right = dx > 0;
    for (let y = h - top; y < h; y++) {
      const depth = y - (h - top);
      let col = right ? c.dark : c.light;
      if (c.snow && top >= c.snowMin && depth < Math.min(6, top - c.snowMin + 1)) col = right ? c.snowD : c.snow;
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}
const MTN = {
  far: {
    w: 200, h: 48, base: 0.74, k: 0.15,
    peaks: [[22,30],[62,42],[112,34],[150,46],[186,32]],
    day:   { light:'#a7b8ea', dark:'#8c9dd8', snow:'#ffffff', snowD:'#dde5ff', snowMin:38 },
    night: { light:'#3b3f86', dark:'#2d3175', snow:'#aab1ea', snowD:'#8188cc', snowMin:38 }
  },
  near: {
    w: 200, h: 32, base: 0.84, k: 0.30,
    peaks: [[10,20],[52,30],[95,22],[138,32],[178,24]],
    day:   { light:'#7f93d0', dark:'#6a7dc0' },
    night: { light:'#272b66', dark:'#1e2154' }
  }
};
for (const key in MTN) {
  const m = MTN[key];
  m.dayC   = makeMountains(m.w, m.h, m.peaks, m.day);
  m.nightC = makeMountains(m.w, m.h, m.peaks, m.night);
}

/* --- Підміна на свої PNG (див. розділ 2) --- */
function loadImg(url, cb) { if (!url) return; const im = new Image(); im.onload = () => cb(im); im.src = url; }
loadImg(CUSTOM.hero.idle, im => HERO.idle = im);
loadImg(CUSTOM.hero.a,    im => HERO.a = im);
loadImg(CUSTOM.hero.b,    im => HERO.b = im);
loadImg(CUSTOM.stairTop,  im => { TILES.day.top  = [im]; TILES.night.top  = [tint(im, NIGHT_TINT)]; });
loadImg(CUSTOM.stairBody, im => {
  for (const k of ['body', 'bottom']) { TILES.day[k] = [im]; TILES.night[k] = [tint(im, NIGHT_TINT)]; }
});

/* Іконки в DOM */
document.querySelectorAll('img[data-icon]').forEach(im => { im.src = ICONS[im.dataset.icon].toDataURL(); });

/* ==========================================================================
   6. СТАН ГРИ + ЗБЕРЕЖЕННЯ
   ========================================================================== */
function load() {
  const d = { score: 0, steps: 0, powerLvl: 1, autoLvl: 0 };
  try {
    const raw = localStorage.getItem(CFG.SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      for (const k in d) { const v = Number(s[k]); if (Number.isFinite(v) && v >= 0) d[k] = Math.floor(v); }
      if (d.powerLvl < 1) d.powerLvl = 1;
    }
  } catch (e) {}
  return d;
}
const state = load();     // score — бали, steps — скільки сходинок пройдено, powerLvl — бали за клік, autoLvl — автокроків/сек
let pos = state.steps;    // плавна позиція героя (для анімації)
let autoAcc = 0, dirty = false, uiDirty = true, bump = false, lastSave = 0;

function save() { try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(state)); } catch (e) {} dirty = false; lastSave = performance.now(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

const costPower = () => Math.ceil(CFG.POWER_BASE_COST * Math.pow(CFG.POWER_GROWTH, state.powerLvl - 1));
const costAuto  = () => Math.ceil(CFG.AUTO_BASE_COST  * Math.pow(CFG.AUTO_GROWTH,  state.autoLvl));

/* ==========================================================================
   7. ЕКРАН, КАМЕРА, СЦЕНА
   ================================== */
   const stage = $('stage'), cv = $('game'), ctx = cv.getContext('2d');
const floatersEl = $('floaters');
const STEP = 16;
let W = 0, H = 0, S = 3, cx = 0, cy = 0;    // логічний розмір, масштаб, позиція героя (ноги)
let stars = [], clouds = [];

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  S = Math.max(2, Math.min(Math.ceil(w / 150), Math.floor(h / 110)));
  W = Math.ceil(w / S); H = Math.ceil(h / S);
  cv.width = W; cv.height = H;
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  ctx.imageSmoothingEnabled = false;
  cx = Math.round(W * 0.42);
  cy = Math.round(H * 0.62);

  const r = rng(12345);
  stars = []; clouds = [];
  for (let i = 0; i < 48; i++) stars.push({ x: r() * W, y: r() * H, ph: r() * 6.28, big: r() < 0.18 });
  for (let i = 0; i < 8; i++) clouds.push({ x: r() * (W + 60), y: r() * (H + 40), p: 0.25 + r() * 0.45, spr: CLOUDS[(r() * 3) | 0], v: 2 + r() * 4 });
}
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

/* --- небо: день → захід → ніч → світанок --- */
const SKY = [
  { t: 0.00, top: [ 78,170,255], bot: [196,232,255] },
  { t: 0.20, top: [ 96,160,240], bot: [255,224,160] },
  { t: 0.34, top: [120, 90,180], bot: [255,150, 90] },
  { t: 0.48, top: [ 44, 36,110], bot: [140, 80,140] },
  { t: 0.58, top: [ 12, 14, 46], bot: [ 40, 40,100] },
  { t: 0.72, top: [ 30, 30, 90], bot: [110, 70,140] },
  { t: 0.85, top: [110,120,210], bot: [255,170,150] },
  { t: 1.00, top: [ 78,170,255], bot: [196,232,255] }
];
function skyAt(ph) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const a = SKY[i], b = SKY[i + 1];
    if (ph <= b.t) { const t = (ph - a.t) / (b.t - a.t); return [mix3(a.top, b.top, t), mix3(a.bot, b.bot, t)]; }
  }
  return [SKY[0].top, SKY[0].bot];
}

function drawSky(ph) {
  const [top, bot] = skyAt(ph), bands = 18, bh = Math.ceil(H / bands);
  for (let i = 0; i < bands; i++) {
    ctx.fillStyle = rgb(mix3(top, bot, i / (bands - 1)));
    ctx.fillRect(0, i * bh, W, bh);
  }
}
function drawSunMoon(n) {
  const x = Math.round(W * 0.14), y = 40;
  const sunA = clamp(1 - n * 2.2, 0, 1);
  if (sunA > 0.01) { ctx.globalAlpha = sunA; ctx.drawImage(SUN, x, y); }
  if (n > 0.15)    { ctx.globalAlpha = clamp((n - 0.15) * 1.5, 0, 1); ctx.drawImage(MOON, x, y); }
  ctx.globalAlpha = 1;
}
function drawStars(n, climb, t) {
  if (n < 0.02) return;
  for (const s of stars) {
    const x = Math.round(mod(s.x - climb * 0.04, W)), y = Math.round(mod(s.y + climb * 0.04, H));
    ctx.globalAlpha = n * (0.55 + 0.45 * Math.sin(t * 3 + s.ph));
    ctx.fillStyle = '#fffbe0';
    ctx.fillRect(x, y, 1, 1);
    if (s.big) { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }
  }
  ctx.globalAlpha = 1;
}
function drawClouds(n, climb, t) {
  ctx.globalAlpha = 0.95 - 0.6 * n;
  const loopH = H + 40, loopW = W + 60;
  for (const c of clouds) {
    const y = Math.round(mod(c.y + climb * c.p, loopH) - 20);
    const x = Math.round(mod(c.x - climb * c.p * 0.6 + t * c.v, loopW) - 30);
    ctx.drawImage(c.spr, x, y);
  }
  ctx.globalAlpha = 1;
}
function drawMountains(key, n, climb) {
  const m = MTN[key], bottom = Math.round(H * m.base + climb * m.k);
  if (bottom - m.h > H) return;
  const off = Math.round(mod(climb * m.k, m.w));
  for (const [img, alpha, col] of [[m.dayC, 1, m.day.dark], [m.nightC, n, m.night.dark]]) {
    if (alpha < 0.01) continue;
    ctx.globalAlpha = alpha;
    for (let x = -off; x < W; x += m.w) ctx.drawImage(img, x, bottom - m.h);
    if (bottom < H) { ctx.fillStyle = col; ctx.fillRect(0, bottom, W, H - bottom); }
  }
  ctx.globalAlpha = 1;
}

/* --- сходи: кожна сходинка — стовпчик із кількох блоків (трава, камінь, темний низ) --- */
function drawStairs(set, alpha) {
  ctx.globalAlpha = alpha;
  const iMin = Math.floor(pos - (cx + 8) / STEP) - 1;
  const iMax = Math.ceil(pos + (W - cx + 8) / STEP) + 1;
  for (let i = iMin; i <= iMax; i++) {
    const x = Math.round(cx - 8 + (i - pos) * STEP);
    const top = Math.round(cy - (i - pos) * STEP);
    if (x > W || x + STEP < 0) continue;
    const j0 = Math.max(0, Math.floor(-top / STEP));
    for (let j = j0; j < CFG.STAIR_DEPTH && top + j * STEP < H; j++) {
      const arr = j === 0 ? set.top : (j === CFG.STAIR_DEPTH - 1 ? set.bottom : set.body);
      const tile = arr[hash2(i, j) % arr.length];
      ctx.drawImage(tile, x, top + j * STEP, STEP, STEP);
    }
  }
  ctx.globalAlpha = 1;
}

/* --- герой --- */
function drawHero(t) {
  const moving = state.steps - pos > 0.06;
  const frac = pos - Math.floor(pos);
  let spr = HERO.idle, lift = 0;
  if (moving) {
    spr = (Math.floor(pos * 2) & 1) ? HERO.b : HERO.a;
    lift = Math.round(Math.sin(frac * Math.PI) * 5);        // «підстрибує» на сходинку
  } else {
    lift = -(Math.floor(t * 2.5) % 2);                       // легке дихання
  }
  ctx.drawImage(spr, Math.round(cx - spr.width / 2), Math.round(cy - spr.height - lift));
}

/* --- часточки --- */
const parts = [];
function burst(x, y, n, spd, cols) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.6);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.4, life: 0.5 + Math.random() * 0.3, c: cols[(Math.random() * cols.length) | 0], s: Math.random() < 0.3 ? 2 : 1 });
  }
  if (parts.length > 140) parts.splice(0, parts.length - 140);
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += 200 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.min(1, p.life * 3);
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
}
const SPARK = ['#ffd23f', '#fff6dc', '#7be0a4'];

/* --- кадр --- */
let time = 0;
function draw() {
  if (!W) return;
  const climb = pos * STEP;
  const ph = mod(pos / CFG.DAY_LENGTH, 1);
  const n = clamp(1 - Math.abs(ph - 0.58) / 0.2, 0, 1);     // «нічність» 0..1

  drawSky(ph);
  drawSunMoon(n);
  drawStars(n, climb, time);
  drawClouds(n, climb, time);
  drawMountains('far', n, climb);
  drawMountains('near', n, climb);
  drawStairs(TILES.day, 1);
  if (n > 0.02) drawStairs(TILES.night, n * 0.65);
  drawHero(time);
  drawParts();
}

/* ==========================================================================
   8. ГЕЙМПЛЕЙ
   ========================================================================== */
const hintEl = $('hint');
let lastFloater = 0, lastHaptic = 0;

function floater(text, x, y) {
  const d = document.createElement('div');
  d.className = 'floater'; d.textContent = text;
  d.style.left = x + 'px'; d.style.top = y + 'px';
  if (floatersEl.childElementCount > 14) floatersEl.firstChild.remove();
  floatersEl.appendChild(d);
  if (d.animate) {
    const a = d.animate(
      [{ transform: 'translate(-50%,0)', opacity: 1 }, { transform: 'translate(-50%,-56px)', opacity: 0 }],
      { duration: 700, easing: 'ease-out' });
    a.onfinish = () => d.remove();
  } else setTimeout(() => d.remove(), 700);
}

/* Один «крок» — і від кліку, і від автокліку: +бали, +сходинка */
function climbStep(auto) {
  state.score += state.powerLvl;
  state.steps += 1;
  dirty = true; uiDirty = true;
  const now = performance.now();
  if (now - lastFloater > (auto ? 260 : 50)) {
    lastFloater = now;
    floater('+' + fmt(state.powerLvl), (cx + Math.random() * 10 - 5) * S, (cy - 26) * S);
  }
  burst(cx, cy - 2, 3, 40, SPARK);
  if (!auto) {
    bump = true;
    hintEl.classList.add('off');
    if (now - lastHaptic > 70) { lastHaptic = now; haptic('light'); }
  }
}

stage.addEventListener('pointerdown', e => { e.preventDefault(); climbStep(false); });
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); if (!e.repeat) climbStep(false); }
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* --- покращення --- */
const btnPower = $('up-power'), btnAuto = $('up-auto');
function deny(btn) {
  hapticNote('error');
  if (btn.animate) btn.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 180 });
}
function celebrate(btn) {
  hapticNote('success');
  if (btn.animate) btn.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 200 });
  burst(cx, cy - 10, 18, 70, SPARK);
}
btnPower.addEventListener('click', () => {
  const c = costPower();
  if (state.score < c) return deny(btnPower);
  state.score -= c; state.powerLvl += 1;              // +1 бал за клік
  dirty = true; uiDirty = true; celebrate(btnPower);
});
btnAuto.addEventListener('click', () => {
  const c = costAuto();
  if (state.score < c) return deny(btnAuto);
  state.score -= c; state.autoLvl += 1;               // +1 автокрок на секунду
  dirty = true; uiDirty = true; celebrate(btnAuto);
});

/* --- інтерфейс --- */
const scoreEl = $('score');
function renderUI() {
  scoreEl.textContent = fmt(state.score);
  $('per-click').textContent = `+${fmt(state.powerLvl)} за клік` + (state.autoLvl ? ` · авто ${state.autoLvl}/с` : '');

  const cp = costPower(), ca = costAuto();
  $('cost-power').textContent = fmt(cp);
  $('lvl-power').textContent  = 'рів. ' + state.powerLvl;
  $('eff-power').textContent  = `Клік: ${fmt(state.powerLvl)} → ${fmt(state.powerLvl + 1)}`;
  $('cost-auto').textContent  = fmt(ca);
  $('lvl-auto').textContent   = 'рів. ' + state.autoLvl;
  $('eff-auto').textContent   = `Авто: ${state.autoLvl} → ${state.autoLvl + 1}/с`;
  btnPower.classList.toggle('can', state.score >= cp);
  btnAuto.classList.toggle('can',  state.score >= ca);

  if (bump && scoreEl.animate) {
    scoreEl.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.1)' }, { transform: 'scale(1)' }], { duration: 110 });
  }
  bump = false; uiDirty = false;
}

/* ==========================================================================
   9. ГОЛОВНИЙ ЦИКЛ
   ========================================================================== */
function update(dt) {
  if (state.autoLvl > 0) {                              // автоклікер
    autoAcc += dt * state.autoLvl;
    let guard = 0;
    while (autoAcc >= 1 && guard++ < 8) { autoAcc -= 1; climbStep(true); }
    if (autoAcc > 8) autoAcc = 0;
  }
  let diff = state.steps - pos;                         // герой доганяє «справжню» позицію
  if (diff > 3.5) { pos = state.steps - 3.5; diff = 3.5; }
  if (diff > 0.001) {
    pos += diff * (1 - Math.exp(-dt * 20));
    if (state.steps - pos < 0.02) pos = state.steps;
  }
  updateParts(dt);
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  try {
    if (!W) resize();
    update(dt);
    draw();
    if (uiDirty) renderUI();
    if (dirty && now - lastSave > 1500) save();
  } catch (e) { window.__showErr && window.__showErr('Кадр: ' + (e && e.stack || e)); }
}

resize();
if (state.steps > 0) hintEl.classList.add('off');
renderUI();
requestAnimationFrame(frame);
window.addEventListener('load', resize);
window.__started = true;

/* Telegram SDK вантажимо після старту гри — якщо він недоступний, гра все одно працює */
try {
  const sdk = document.createElement('script');
  sdk.src = 'https://telegram.org/js/telegram-web-app.js';
  sdk.async = true; sdk.onload = initTelegram;
  document.head.appendChild(sdk);
} catch (e) {}
})();
</script>
</body>
</html>
