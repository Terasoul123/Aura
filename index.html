<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест браузера</title>
<style>
  body{margin:0;padding:16px;font:16px/1.5 sans-serif;background:#111;color:#fff}
  h1{font-size:22px;margin:0 0 12px}
  #main{padding:14px;border-radius:10px;background:#a82d34;font-size:20px;font-weight:bold}
  #main.ok{background:#1f7a3d}
  .row{padding:6px 0;border-bottom:1px solid #333}
  .ok{color:#7be0a4}.bad{color:#ff8a8a}
  canvas{image-rendering:pixelated;width:96px;height:96px;background:#4aa8ff;margin-top:10px;display:block}
</style>
</head>
<body>
<h1>Тест браузера</h1>
<div id="main">JavaScript НЕ ПРАЦЮЄ ✗<br><small>Якщо ви бачите цей червоний блок — браузер не запускає скрипти.</small></div>
<div id="list"></div>
<canvas id="c" width="12" height="12"></canvas>

<script>
(function () {
  var main = document.getElementById('main');
  main.className = 'ok';
  main.innerHTML = 'JavaScript ПРАЦЮЄ ✓';
  var list = document.getElementById('list');
  function row(name, fn) {
    var ok, note = '';
    try { var r = fn(); ok = !!r; if (typeof r === 'string') note = ' — ' + r; } catch (e) { ok = false; note = ' — ' + e; }
    var d = document.createElement('div');
    d.className = 'row ' + (ok ? 'ok' : 'bad');
    d.textContent = (ok ? '✓ ' : '✗ ') + name + note;
    list.appendChild(d);
  }
  row('Canvas 2D', function () { return document.createElement('canvas').getContext('2d'); });
  row('Малювання пікселів (getImageData)', function () {
    var c = document.createElement('canvas'); c.width = c.height = 4;
    var g = c.getContext('2d'); g.fillStyle = '#ff0000'; g.fillRect(0, 0, 4, 4);
    return g.getImageData(0, 0, 1, 1).data[0] === 255;
  });
  row('toDataURL (іконки)', function () {
    var c = document.createElement('canvas'); c.width = c.height = 4;
    c.getContext('2d').fillRect(0, 0, 4, 4);
    return c.toDataURL().length > 40;
  });
  row('localStorage (збереження)', function () { localStorage.setItem('t', '1'); return localStorage.getItem('t') === '1'; });
  row('requestAnimationFrame', function () { return typeof requestAnimationFrame === 'function'; });
  row('ResizeObserver', function () { return typeof ResizeObserver === 'function'; });
  row('Math.imul, Math.hypot', function () { return Math.imul(2, 3) === 6 && Math.hypot(3, 4) === 5; });
  row('element.animate', function () { return typeof document.body.animate === 'function'; });
  row('CSS 100dvh', function () { return window.CSS && CSS.supports('height', '100dvh'); });
  row('Браузер', function () { return navigator.userAgent; });

  var c = document.getElementById('c').getContext('2d');
  c.fillStyle = '#ffd23f'; c.fillRect(2, 2, 8, 8);
  c.fillStyle = '#e4453f'; c.fillRect(4, 4, 4, 4);
})();
</script>
</body>
</html>
