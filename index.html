<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1035">
<title>Сходи в небо</title>

<!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Піксельний шрифт (має кирилицю) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1b1035;        /* фон нижньої панелі */
    --card:#2c1f5c;       /* кнопка покращення */
    --edge:#5b47b0;
    --edge-dark:#241a52;
    --gold:#ffd23f;
    --paper:#fff6dc;
    --dim:#9d90cf;
    --pixel:'Press Start 2P','Courier New',monospace;
    --o2:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink);
    --o3:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px -3px var(--ink),3px -3px var(--ink),-3px 3px var(--ink);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none}
  body{font-family:var(--pixel);color:var(--paper)}

  #app{
    position:fixed;top:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:560px;
    height:100vh;height:100dvh;max-height:var(--tg-viewport-stable-height,100dvh);
    display:flex;flex-direction:column;background:var(--ink);
  }

  /* ---------- сцена ---------- */
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;cursor:pointer;background:#0a1420}
  #game{position:absolute;left:0;top:0;display:block;image-rendering:pixelated}

  #hud{
    position:absolute;left:0;right:0;top:0;
    padding:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 16px) 12px 0;
    display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;
  }
  #score-row{display:flex;align-items:center;gap:10px}
  #score-star{width:27px;height:27px;image-rendering:pixelated}
  #score{font-size:28px;line-height:1;color:var(--gold);text-shadow:var(--o3),0 5px 0 var(--ink)}
  #score-diamond{width:22px;height:22px;image-rendering:pixelated;margin-left:6px}
  #diamonds{font-size:20px;line-height:1;color:#7ee3ff;text-shadow:var(--o2),0 4px 0 var(--ink)}
  #per-click{font-size:9px;line-height:1.4;color:var(--paper);text-shadow:var(--o2)}

  /* ---------- бій ---------- */
  #combat-hud{
    position:absolute;left:10px;right:10px;bottom:14px;display:flex;flex-direction:column;gap:6px;
    pointer-events:none;
  }
  #combat-hud.off{display:none}
  .hp-row{display:flex;align-items:center;gap:8px}
  .hp-lbl{font-size:14px;text-shadow:var(--o2)}
  .hp-bar{flex:1 1 auto;height:12px;background:#1a1030;border:2px solid #000;box-shadow:inset 0 0 0 1px #4b3a8f}
  .hp-fill{height:100%;width:100%}
  .hp-fill.mons{background:linear-gradient(#ff6b6b,#c62d2d)}
  .hp-fill.hero{background:linear-gradient(#8fe06a,#4ea83a)}
  .hp-num{font-size:8px;color:var(--paper);text-shadow:var(--o2);min-width:44px;text-align:right}

  /* ---------- вкладки ---------- */
  #tabs{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px 0;background:var(--ink)}
  .tab{
    flex:1 1 auto;padding:8px;border:0;background:#2c1f5c;color:var(--dim);font-family:var(--pixel);
    font-size:10px;box-shadow:inset 0 0 0 2px #4b3a8f;cursor:pointer;touch-action:manipulation;
  }
  .tab.active{background:#3d2a7a;color:var(--paper);box-shadow:inset 0 0 0 2px var(--gold)}

  /* ---------- зброя ---------- */
  #panel-wpn{
    flex:0 0 auto;max-height:34vh;overflow-y:auto;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--ink);border-top:4px solid #4b3a8f;display:flex;flex-direction:column;gap:8px;
  }
  #panel-wpn.off{display:none}
  .wpn{
    display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);
    box-shadow:inset 0 0 0 3px var(--edge),inset 0 -6px 0 0 var(--edge-dark);
  }
  .wpn.owned{--edge:#4ea83a;--edge-dark:#215c1e}
  .wpn.can{--edge:var(--gold);--edge-dark:#8a5a0a}
  .wpn-ic{font-size:20px;flex:none}
  .wpn-info{flex:1 1 auto;min-width:0}
  .wpn-name{font-size:10px;color:var(--paper)}
  .wpn-dmg{font-size:8px;color:var(--dim);margin-top:3px}
  .wpn-btn{
    flex:none;border:0;padding:8px 10px;background:#4b3a8f;color:var(--paper);font-family:var(--pixel);
    font-size:9px;display:flex;align-items:center;gap:5px;cursor:pointer;touch-action:manipulation;
  }
  .wpn-btn img{width:14px;height:14px;image-rendering:pixelated}
  .wpn-btn.can{background:var(--gold);color:#3a2400}
  .wpn-btn.owned{background:#215c1e;color:#bdf5b0}
  .wpn-btn:disabled{opacity:.7}

  #floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .floater{position:absolute;font-size:14px;color:var(--gold);text-shadow:var(--o2);white-space:nowrap;will-change:transform,opacity}

  #hint{
    position:absolute;left:0;right:0;bottom:18px;text-align:center;
    font-size:11px;color:var(--gold);text-shadow:var(--o2);pointer-events:none;
    animation:blink 1.2s steps(1) infinite;
  }
  #hint.off{display:none}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}

  /* ---------- панель покращень ---------- */
  #panel{
    flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--ink);border-top:4px solid #4b3a8f;
  }
  .up{
    --edge:#5b47b0;--edge-dark:#241a52;
    position:relative;display:flex;flex-direction:column;gap:8px;
    padding:12px 12px 16px;border:0;margin:0;background:var(--card);
    font-family:var(--pixel);color:var(--dim);text-align:left;cursor:pointer;touch-action:manipulation;
    box-shadow:inset 0 0 0 3px var(--edge),inset 0 -8px 0 0 var(--edge-dark);
    clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  }
  .up.can{--edge:var(--gold);--edge-dark:#8a5a0a;background:#3d2a7a}
  .up:active{transform:translateY(2px)}
  .up:focus-visible{--edge:var(--paper)}
  .up-head{display:flex;align-items:center;gap:8px}
  .up-head img{width:27px;height:27px;flex:none;image-rendering:pixelated}
  .up-name{font-size:10px;line-height:1.35;color:var(--paper)}
  .up-eff{font-size:8px;line-height:1.5;color:var(--dim)}
  .up-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:2px}
  .cost{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
  .cost img{width:18px;height:18px;image-rendering:pixelated;filter:grayscale(1) opacity(.55)}
  .up.can .cost{color:var(--gold)}
  .up.can .cost img{filter:none}
  .lvl{font-size:8px;color:var(--dim);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){#hint{animation:none}}
</style>
</head>

<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="score-row">
        <img id="score-star" data-icon="star" alt=""><span id="score">0</span>
        <img id="score-diamond" data-icon="diamond" alt=""><span id="diamonds">0</span>
      </div>
      <div id="per-click">+1 за клік</div>
    </div>

    <div id="combat-hud" class="off">
      <div class="hp-row"><span class="hp-lbl">👹</span><div class="hp-bar"><div class="hp-fill mons" id="mhp-fill"></div></div><span class="hp-num" id="mhp-num"></span></div>
      <div class="hp-row"><span class="hp-lbl">❤</span><div class="hp-bar"><div class="hp-fill hero" id="php-fill"></div></div><span class="hp-num" id="php-num"></span></div>
    </div>

    <div id="floaters"></div>
    <div id="hint">Тапай по екрану!</div>
  </div>

  <div id="tabs">
    <button class="tab active" id="tab-upg" type="button">Прокачка</button>
    <button class="tab" id="tab-wpn" type="button">⚔ Зброя</button>
  </div>

  <div id="panel">
    <button class="up" id="up-power" type="button">
      <div class="up-head"><img data-icon="arrow" alt=""><span class="up-name">Сила кліку</span></div>
      <div class="up-eff" id="eff-power"></div>
      <div class="up-foot">
        <span class="cost"><img data-icon="star" alt=""><b id="cost-power">10</b></span>
        <span class="lvl" id="lvl-power"></span>
      </div>
    </button>

    <button class="up" id="up-auto" type="button">
      <div class="up-head"><img data-icon="bolt" alt=""><span class="up-name">Автоклік</span></div>
      <div class="up-eff" id="eff-auto"></div>
      <div class="up-foot">
        <span class="cost"><img data-icon="star" alt=""><b id="cost-auto">50</b></span>
        <span class="lvl" id="lvl-auto"></span>
      </div>
    </button>
  </div>

  <div id="panel-wpn" class="off"></div>
</div>

const mod = (a, n) => ((a % n) + n) % n;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb  = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
function rng(seed) { let s = seed >>> 0; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
function hash2(a, b) {
  let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e7) return (n / 1e6).toFixed(2) + 'M';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function fromRows(rows, pal = PAL) {

}

/* --- Блоки сходів 16×16: цегла + трава зверху --- */
const STONE = { base:'#4d4568', light:'#655c86', shade:'#332c4a', mortar:'#211c33' };
const GRASS = { hi:'#8fe06a', mid:'#4ea83a', dark:'#256b24' };
function makeBlock(kind, variant) {   // kind: 'top' | 'body' | 'bottom'
  const c = mk(16, 16), g = c.getContext('2d');
  const r = rng(variant * 977 + (kind === 'top' ? 13 : kind === 'bottom' ? 41 : 71));
  const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  for (let y = 0; y < 16; y++) {
    const course = y >> 2, row = y & 3, off = (course & 1) ? 4 : 0;
    for (let x = 0; x < 16; x++) {
      const xx = (x + off) & 7;
      let col;
      if (row === 3 || xx === 7) col = STONE.mortar;
      else if (row === 0)        col = STONE.light;
      else if (xx === 6)         col = STONE.shade;
      else                       col = STONE.base;
      px(x, y, col);
    }
  }
  for (let i = 0; i < 6; i++) px((r() * 16) | 0, (r() * 16) | 0, r() < .5 ? STONE.shade : STONE.light);
  if (kind === 'bottom') {                       // темний низ, щоб сходи мали об'єм
    for (let x = 0; x < 16; x++) { px(x, 13, STONE.shade); px(x, 14, STONE.mortar); px(x, 15, '#3a3159'); }
  }
  if (kind === 'top') {
    for (let x = 0; x < 16; x++) {
      const d = (x * 7 + variant * 5) % 5;
      px(x, 0, GRASS.hi); px(x, 1, GRASS.mid); px(x, 2, GRASS.mid);
      if (d < 4) px(x, 3, GRASS.dark);
      if (d % 2 === 0) px(x, 4, GRASS.dark);
      if (d === 1 && variant === 2) px(x, 0, '#ffe66d');   // жовта квіточка
    }
    const rd = rng(variant * 401 + 17);
    for (let x = 0; x < 16; x++) {
      if (rd() < 0.8) {
        const len = 4 + ((rd() * 8) | 0);
        for (let dy = 0; dy < len && 5 + dy < 16; dy++) {
          const tip = dy >= len - 2;
          px(x, 5 + dy, tip ? '#1a3f1a' : GRASS.dark);
        }
        if (rd() < 0.3) px(x, Math.min(15, 5 + len - 1), '#c8ffb0');   // світлячок-іскра на кінці моху
      }
    }
  }
  return c;
}
function tint(src, m) {
  const c = mk(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  try {
    const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
    for (let i = 0; i < a.length; i += 4) { a[i] *= m[0]; a[i + 1] *= m[1]; a[i + 2] *= m[2]; }
    g.putImageData(d, 0, 0);
  } catch (e) { return src; }
  return c;
}
const NIGHT_TINT = [0.6, 0.8, 0.72];
const TILES = { day: { top: [], body: [], bottom: [] }, night: { top: [], body: [], bottom: [] } };
for (let v = 0; v < 3; v++) {

  TILES.day.body.push(makeBlock('body', v));
  TILES.day.bottom.push(makeBlock('bottom', v));
}
for (const k of ['top', 'body', 'bottom']) TILES.night[k] = TILES.day[k].map(t => tint(t, NIGHT_TINT));

function makeCloud(w, h, blobs) {
  const c = mk(w, h), g = c.getContext('2d');
  for (let y = 0; y < h - 1; y++) for (let x = 0; x < w; x++) {
    let inside = false;
    for (const [bx, by, br] of blobs) { const dx = x - bx, dy = y - by; if (dx * dx + dy * dy <= br * br) { inside = true; break; } }
    if (inside) { g.fillStyle = y >= h - 4 ? '#3f5a54' : (y <= 2 ? '#b9d6bf' : '#7fa294'); g.fillRect(x, y, 1, 1); }
  }
  return c;
}

  makeCloud(34, 12, [[8,9,5],[16,6,6],[25,8,6],[30,9,3]]),
  makeCloud(46, 15, [[9,11,7],[20,7,8],[32,9,8],[40,11,5]])

function makeDisc(kind) {
  const c = mk(15, 15), g = c.getContext('2d');
  for (let y = 0; y < 15; y++) for (let x = 0; x < 15; x++) {
    const d = Math.hypot(x - 7, y - 7);
    if (d > 7) continue;
    if (kind === 'sun') { g.fillStyle = d > 5.4 ? '#ffb833' : '#ffe66d'; }
    else {
      if (Math.hypot(x - 10, y - 5) <= 6.2) continue;               // вирізаємо серп
      g.fillStyle = (x + y) % 5 === 0 ? '#d8d3a0' : '#f3efc6';
    }
    g.fillRect(x, y, 1, 1);
  }
  return c;
}
const SUN = makeDisc('sun'), MOON = makeDisc('moon');
function makeFullMoon() {
  const c = mk(15, 15), g = c.getContext('2d');
  for (let y = 0; y < 15; y++) for (let x = 0; x < 15; x++) {
    const d = Math.hypot(x - 7, y - 7);
    if (d > 7) continue;
    let col;
    if (d > 5.6) col = '#bfe6ad';
    else if ((x * 3 + y * 7) % 11 === 0) col = '#a8d99a';
    else col = '#e9f6d8';
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  return c;
}

function makeMountains(w, h, peaks, c) {
  const cv = mk(w, h), g = cv.getContext('2d');
  for (let x = 0; x < w; x++) {
    let top = 3, px = 0;
    for (const [p, ph] of peaks) {
      const d = Math.min(Math.abs(x - p), w - Math.abs(x - p)), v = ph - d;
      if (v > top) { top = v; px = p; }
    }
    let dx = x - px; if (dx > w / 2) dx -= w; if (dx < -w / 2) dx += w;
    const right = dx > 0;
    for (let y = h - top; y < h; y++) {
      const depth = y - (h - top);
      let col = right ? c.dark : c.light;
      if (c.snow && top >= c.snowMin && depth < Math.min(6, top - c.snowMin + 1)) col = right ? c.snowD : c.snow;
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

  /* ==========================================================================

function load() {
  const d = {
    score: 0, steps: 0, powerLvl: 1, autoLvl: 0,
    diamonds: 0, totalStars: 0, floorTier: 0,
    hp: CFG.HP_MAX, weapons: ['fists']
  };
  try {
    const raw = localStorage.getItem(CFG.SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      for (const k in d) {
        if (k === 'weapons') continue;
        const v = Number(s[k]); if (Number.isFinite(v) && v >= 0) d[k] = Math.floor(v);
      }
      if (Array.isArray(s.weapons)) {
        const ids = new Set(WEAPONS.map(w => w.id));
        const owned = s.weapons.filter(id => ids.has(id));
        d.weapons = owned.includes('fists') ? owned : ['fists', ...owned];
      }
      if (d.powerLvl < 1) d.powerLvl = 1;
      if (d.floorTier > TIERS.length) d.floorTier = TIERS.length;
      if (d.hp <= 0 || d.hp > CFG.HP_MAX) d.hp = CFG.HP_MAX;
    }
  } catch (e) {}
  return d;
}
const state = load();     // score — бали, steps — скільки сходинок пройдено, powerLvl — бали за клік, autoLvl — автокроків/сек
let pos = state.steps;    // плавна позиція героя (для анімації)
let autoAcc = 0, dirty = false, uiDirty = true, bump = false, lastSave = 0;
let combat = null;                                    // {hp,hpMax,dmg,reward,atkAcc,hitFlash}
let nextEncounter = state.steps + CFG.ENC_MIN_GAP + Math.random() * (CFG.ENC_MAX_GAP - CFG.ENC_MIN_GAP);

function save() { try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(state)); } catch (e) {} dirty = false; lastSave = performance.now(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

const costPower = () => Math.ceil(CFG.POWER_BASE_COST * Math.pow(CFG.POWER_GROWTH, state.powerLvl - 1));
const costAuto  = () => Math.ceil(CFG.AUTO_BASE_COST  * Math.pow(CFG.AUTO_GROWTH,  state.autoLvl));

/* ==========================================================================

const stage = $('stage'), cv = $('game'), ctx = cv.getContext('2d');
const floatersEl = $('floaters');
const STEP = 16;
let W = 0, H = 0, S = 3, cx = 0, cy = 0;    // логічний розмір, масштаб, позиція героя (ноги)
let stars = [], clouds = [];

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  S = Math.max(2, Math.min(Math.ceil(w / 150), Math.floor(h / 110)));
  W = Math.ceil(w / S); H = Math.ceil(h / S);
  cv.width = W; cv.height = H;
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  ctx.imageSmoothingEnabled = false;
  cx = Math.round(W * 0.42);
  cy = Math.round(H * 0.62);

  const r = rng(12345);
  stars = []; clouds = [];
  for (let i = 0; i < 48; i++) stars.push({ x: r() * W, y: r() * H, ph: r() * 6.28, big: r() < 0.18 });
  for (let i = 0; i < 8; i++) clouds.push({ x: r() * (W + 60), y: r() * (H + 40), p: 0.25 + r() * 0.45, spr: CLOUDS[(r() * 3) | 0], v: 2 + r() * 4 });
}
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);

/* --- небо: колір залежить від поточної локації (поверху) --- */
function drawSky(loc) {
  const bands = 18, bh = Math.ceil(H / bands);
  for (let i = 0; i < bands; i++) {
    ctx.fillStyle = rgb(mix3(loc.sky[0], loc.sky[1], i / (bands - 1)));
    ctx.fillRect(0, i * bh, W, bh);
  }
}
function drawSunMoon() {
  const size = Math.round(Math.min(W, H) * 0.24);
  const x = Math.round(W * 0.16), y = Math.round(H * 0.1);
  const mx = x + size / 2, my = y + size / 2, r = size * 1.7;
  const grad = ctx.createRadialGradient(mx, my, size * 0.3, mx, my, r);
  grad.addColorStop(0, 'rgba(170,235,170,0.45)');
  grad.addColorStop(1, 'rgba(170,235,170,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(MOON_FULL, x, y, size, size);
}
function drawStars(n, climb, t) {
  if (n < 0.02) return;
  for (const s of stars) {
    const x = Math.round(mod(s.x - climb * 0.04, W)), y = Math.round(mod(s.y + climb * 0.04, H));
    ctx.globalAlpha = n * (0.55 + 0.45 * Math.sin(t * 3 + s.ph));
    ctx.fillStyle = s.big ? '#baffb0' : '#eafbe0';
    ctx.fillRect(x, y, 1, 1);
    if (s.big) { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }
  }
  ctx.globalAlpha = 1;
}
function drawClouds(n, climb, t) {
  ctx.globalAlpha = 0.95 - 0.6 * n;
  const loopH = H + 40, loopW = W + 60;
  for (const c of clouds) {
    const y = Math.round(mod(c.y + climb * c.p, loopH) - 20);
    const x = Math.round(mod(c.x - climb * c.p * 0.6 + t * c.v, loopW) - 30);
    ctx.drawImage(c.spr, x, y);
  }
  ctx.globalAlpha = 1;
}
function drawMountains(key, loc, climb) {
  const m = MTN[key], bottom = Math.round(H * m.base + climb * m.k);
  if (bottom - m.h > H) return;
  const off = Math.round(mod(climb * m.k, m.w));
  const img = loc[key + 'C'], col = loc[key].dark;
  for (let x = -off; x < W; x += m.w) ctx.drawImage(img, x, bottom - m.h);
  if (bottom < H) { ctx.fillStyle = col; ctx.fillRect(0, bottom, W, H - bottom); }
}

/* --- сходи: кожна сходинка — стовпчик із кількох блоків (трава, камінь, темний низ) --- */
function drawStairs(set, alpha) {
  ctx.globalAlpha = alpha;
  const iMin = Math.floor(pos - (cx + 8) / STEP) - 1;
  const iMax = Math.ceil(pos + (W - cx + 8) / STEP) + 1;
  for (let i = iMin; i <= iMax; i++) {
    const x = Math.round(cx - 8 + (i - pos) * STEP);
    const top = Math.round(cy - (i - pos) * STEP);
    if (x > W || x + STEP < 0) continue;
    const j0 = Math.max(0, Math.floor(-top / STEP));
    for (let j = j0; j < CFG.STAIR_DEPTH && top + j * STEP < H; j++) {
      const arr = j === 0 ? set.top : (j === CFG.STAIR_DEPTH - 1 ? set.bottom : set.body);
      const tile = arr[hash2(i, j) % arr.length];
      ctx.drawImage(tile, x, top + j * STEP, STEP, STEP);
    }
  }
  ctx.globalAlpha = 1;
}

/* --- герой --- */
function drawHero(t) {
  const moving = state.steps - pos > 0.06;
  const frac = pos - Math.floor(pos);
  let spr = HERO.idle, lift = 0;
  if (moving) {
    spr = (Math.floor(pos * 2) & 1) ? HERO.b : HERO.a;
    lift = Math.round(Math.sin(frac * Math.PI) * 5);        // «підстрибує» на сходинку
  } else {
    lift = -(Math.floor(t * 2.5) % 2);                       // легке дихання
  }
  ctx.drawImage(spr, Math.round(cx - spr.width / 2), Math.round(cy - spr.height - lift));
}

/* --- монстр (бій) --- */
const MONSTER_ROWS_W = [2, 5, 6, 7, 7, 7, 6, 6, 5, 4, 3];
function drawMonster(m, gx, groundY) {
  const flash = m.hitFlash > 0;
  const body = flash ? '#ffffff' : '#241030';
  const dark = flash ? '#eeeeee' : '#150820';
  const h = MONSTER_ROWS_W.length * 2;
  let y = Math.round(groundY - h);
  for (let i = 0; i < MONSTER_ROWS_W.length; i++) {
    const rw = MONSTER_ROWS_W[i];
    ctx.fillStyle = (i % 3 === 0) ? dark : body;
    ctx.fillRect(Math.round(gx - rw), y, rw * 2, 2);
    y += 2;
  }
  const eyeCol = flash ? '#ff9a9a' : '#ff4d4d';
  ctx.fillStyle = eyeCol;
  ctx.fillRect(Math.round(gx - 5), Math.round(groundY - h + 6), 2, 2);
  ctx.fillRect(Math.round(gx + 3), Math.round(groundY - h + 6), 2, 2);
}

/* --- часточки --- */
const parts = [];
function burst(x, y, n, spd, cols) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.6);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.4, life: 0.5 + Math.random() * 0.3, c: cols[(Math.random() * cols.length) | 0], s: Math.random() < 0.3 ? 2 : 1 });
  }
  if (parts.length > 140) parts.splice(0, parts.length - 140);
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += 200 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.min(1, p.life * 3);
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
}
const SPARK = ['#ffd23f', '#fff6dc', '#7be0a4'];

/* --- кадр --- */
let time = 0;
function draw() {
  if (!W) return;
  const climb = pos * STEP;
  const n = 1;
  const loc = locFor(state.floorTier);

  drawSky(loc);
  drawSunMoon();
  drawStars(n, climb, time);
  drawClouds(n, climb, time);
  drawMountains('far', loc, climb);
  drawMountains('near', loc, climb);
  drawStairs(loc.tiles, 1);
  if (combat) drawMonster(combat, cx + 24, cy);
  drawHero(time);
  drawParts();
}

const hintEl = $('hint');
let lastFloater = 0, lastHaptic = 0;

function floater(text, x, y) {
  const d = document.createElement('div');
  d.className = 'floater'; d.textContent = text;
  d.style.left = x + 'px'; d.style.top = y + 'px';
  if (floatersEl.childElementCount > 14) floatersEl.firstChild.remove();
  floatersEl.appendChild(d);
  if (d.animate) {
    const a = d.animate(
      [{ transform: 'translate(-50%,0)', opacity: 1 }, { transform: 'translate(-50%,-56px)', opacity: 0 }],
      { duration: 700, easing: 'ease-out' });
    a.onfinish = () => d.remove();
  } else setTimeout(() => d.remove(), 700);
}

/* Один «крок» — і від кліку, і від автокліку: +бали, +сходинка */
function climbStep(auto) {
  if (combat) return;
  state.score += state.powerLvl;
  state.totalStars += state.powerLvl;
  state.steps += 1;
  dirty = true; uiDirty = true;
  checkTierReward();
  const now = performance.now();
  if (now - lastFloater > (auto ? 260 : 50)) {
    lastFloater = now;
    floater('+' + fmt(state.powerLvl), (cx + Math.random() * 10 - 5) * S, (cy - 26) * S);
  }
  burst(cx, cy - 2, 3, 40, SPARK);
  if (!auto) {
    bump = true;
    hintEl.classList.add('off');
    if (now - lastHaptic > 70) { lastHaptic = now; haptic('light'); }
  }
  if (state.steps >= nextEncounter) startEncounter();
}

function checkTierReward() {
  while (state.floorTier < TIERS.length && state.totalStars >= TIERS[state.floorTier].at) {
    const t = TIERS[state.floorTier];
    const reward = t.dMin + Math.floor(Math.random() * (t.dMax - t.dMin + 1));
    state.diamonds += reward;
    state.floorTier += 1;
    dirty = true; uiDirty = true;
    floater('💎 +' + reward, cx * S, (cy - 70) * S);
    floater(locFor(state.floorTier).name, cx * S, (cy - 92) * S);
    hapticNote('success');
  }
}

/* --- бій з монстром --- */
function startEncounter() {
  const lvl = state.floorTier;
  const hpMax = Math.round(18 + state.steps * 0.35 + lvl * 55 + Math.random() * 20);
  const dmg = Math.round(4 + lvl * 3 + Math.random() * 3);
  combat = { hp: hpMax, hpMax, dmg, reward: Math.round(hpMax * 0.7), atkAcc: 0, hitFlash: 0 };
  uiDirty = true;
  hapticNote('warning');
  $('combat-hud').classList.remove('off');
  hintEl.classList.add('off');
}
function hitMonster() {
  if (!combat) return;
  const dmg = Math.max(1, Math.round(weaponDmg() * (0.85 + Math.random() * 0.3)));
  combat.hp -= dmg;
  combat.hitFlash = 0.12;
  floater('-' + fmt(dmg), (cx + 24 + Math.random() * 8 - 4) * S, (cy - 34) * S);
  burst(cx + 24, cy - 14, 6, 60, ['#ffffff', '#ff8a8a']);
  haptic('rigid');
  uiDirty = true;
  if (combat.hp <= 0) onMonsterDefeated();
}
function onMonsterDefeated() {
  const reward = combat.reward;
  state.score += reward; state.totalStars += reward;
  const diaBonus = Math.random() < 0.18 ? 1 + ((Math.random() * 3) | 0) : 0;
  if (diaBonus) state.diamonds += diaBonus;
  floater('+' + fmt(reward), cx * S, (cy - 26) * S);
  if (diaBonus) floater('💎 +' + diaBonus, cx * S, (cy - 50) * S);
  burst(cx + 24, cy - 14, 20, 90, SPARK);
  combat = null;
  nextEncounter = state.steps + CFG.ENC_MIN_GAP + Math.random() * (CFG.ENC_MAX_GAP - CFG.ENC_MIN_GAP);
  $('combat-hud').classList.add('off');
  dirty = true; uiDirty = true;
  checkTierReward();
  hapticNote('success');
}
function onPlayerDeath() {
  const loss = Math.round(state.score * CFG.DEATH_LOSS);
  state.score = Math.max(0, state.score - loss);
  state.hp = CFG.HP_MAX;
  combat = null;
  nextEncounter = state.steps + CFG.ENC_MIN_GAP + Math.random() * (CFG.ENC_MAX_GAP - CFG.ENC_MIN_GAP);
  $('combat-hud').classList.add('off');
  floater('−' + fmt(loss), cx * S, (cy - 26) * S);
  dirty = true; uiDirty = true;
  hapticNote('error');
}

  hapticNote('success');

tabWpn.addEventListener('click', () => {
  tabWpn.classList.add('active'); tabUpg.classList.remove('active');
  panelWpn.classList.remove('off'); panelUpg.classList.add('off');
});

/* --- крамниця зброї --- */
const curIcon = { star: ICONS.star.toDataURL(), diamond: ICONS.diamond.toDataURL() };
function renderWeapons() {
  const bestOwnedDmg = weaponDmg();
  panelWpn.innerHTML = WEAPONS.map(w => {
    const owned = state.weapons.includes(w.id);
    const equipped = owned && w.dmg === bestOwnedDmg;
    const balance = w.cur === 'star' ? state.score : state.diamonds;
    const can = !owned && balance >= w.cost;
    const cls = ['wpn']; if (owned) cls.push('owned'); if (can) cls.push('can');
    let btn;
    if (owned) btn = `<button class="wpn-btn owned" disabled>${equipped ? '★ У бою' : 'Куплено'}</button>`;
    else btn = `<button class="wpn-btn${can ? ' can' : ''}" data-buy="${w.id}"><img src="${curIcon[w.cur]}" alt="">${fmt(w.cost)}</button>`;
    return `<div class="${cls.join(' ')}"><div class="wpn-ic">⚔</div><div class="wpn-info"><div class="wpn-name">${w.name}</div><div class="wpn-dmg">Урон: ${w.dmg}</div></div>${btn}</div>`;
  }).join('');
  panelWpn.querySelectorAll('[data-buy]').forEach(b => {
    b.addEventListener('click', () => buyWeapon(b.dataset.buy));
  });
}
function buyWeapon(id) {
  const w = WEAPONS.find(x => x.id === id);
  if (!w || state.weapons.includes(id)) return;
  const balance = w.cur === 'star' ? state.score : state.diamonds;
  if (balance < w.cost) { hapticNote('error'); return; }
  if (w.cur === 'star') state.score -= w.cost; else state.diamonds -= w.cost;
  state.weapons.push(id);
  dirty = true; uiDirty = true;
  hapticNote('success');
  burst(cx, cy - 10, 18, 70, SPARK);
}

/* --- інтерфейс --- */
const scoreEl = $('score'), diamondsEl = $('diamonds');
function renderUI() {
  scoreEl.textContent = fmt(state.score);
  diamondsEl.textContent = fmt(state.diamonds);
  $('per-click').textContent = `+${fmt(state.powerLvl)} за клік` + (state.autoLvl ? ` · авто ${state.autoLvl}/с` : '');

  const cp = costPower(), ca = costAuto();
  $('cost-power').textContent = fmt(cp);
  $('lvl-power').textContent  = 'рів. ' + state.powerLvl;
  $('eff-power').textContent  = `Клік: ${fmt(state.powerLvl)} → ${fmt(state.powerLvl + 1)}`;
  $('cost-auto').textContent  = fmt(ca);
  $('lvl-auto').textContent   = 'рів. ' + state.autoLvl;
  $('eff-auto').textContent   = `Авто: ${state.autoLvl} → ${state.autoLvl + 1}/с`;
  btnPower.classList.toggle('can', state.score >= cp);
  btnAuto.classList.toggle('can',  state.score >= ca);

  if (combat) {
    $('mhp-fill').style.width = clamp(combat.hp / combat.hpMax, 0, 1) * 100 + '%';
    $('mhp-num').textContent = Math.max(0, Math.ceil(combat.hp)) + '/' + combat.hpMax;
  }
  $('php-fill').style.width = clamp(state.hp / CFG.HP_MAX, 0, 1) * 100 + '%';
  $('php-num').textContent = Math.max(0, Math.ceil(state.hp)) + '/' + CFG.HP_MAX;

  renderWeapons();

  if (bump && scoreEl.animate) {
    scoreEl.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.1)' }, { transform: 'scale(1)' }], { duration: 110 });
  }
  bump = false; uiDirty = false;
}

/* ==========================================================================
   9. ГОЛОВНИЙ ЦИКЛ
   ========================================================================== */
function update(dt) {
  if (!combat && state.autoLvl > 0) {                   // автоклікер (стоїть під час бою)
    autoAcc += dt * state.autoLvl;
    let guard = 0;
    while (autoAcc >= 1 && guard++ < 8) { autoAcc -= 1; climbStep(true); }
    if (autoAcc > 8) autoAcc = 0;
  }
  let diff = state.steps - pos;                         // герой доганяє «справжню» позицію
  if (diff > 3.5) { pos = state.steps - 3.5; diff = 3.5; }
  if (diff > 0.001) {
    pos += diff * (1 - Math.exp(-dt * 20));
    if (state.steps - pos < 0.02) pos = state.steps;
  }
  if (combat) {
    combat.hitFlash = Math.max(0, combat.hitFlash - dt);
    combat.atkAcc += dt;
    if (combat.atkAcc >= CFG.ENC_ATK_EVERY) {
      combat.atkAcc = 0;
      state.hp -= combat.dmg;
      dirty = true; uiDirty = true;
      burst(cx, cy - 20, 5, 50, ['#ff6b6b', '#ffffff']);
      if (state.hp <= 0) onPlayerDeath();
    }
  }
  updateParts(dt);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  update(dt);
  draw();
  if (uiDirty) renderUI();
  if (dirty && now - lastSave > 1500) save();
  requestAnimationFrame(frame);
}

resize();
if (state.steps > 0) hintEl.classList.add('off');
renderUI();
requestAnimationFrame(frame);
})();
</script>
